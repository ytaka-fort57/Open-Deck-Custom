name: E2E

on:
  push:
    branches:
      - custom
  pull_request:
    branches:
      - custom
  workflow_dispatch:

# 同一ブランチで連続 push された場合は古い実行を取り消す
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
        with:
          # checkout が残す GITHUB_TOKEN の認証ヘッダーは、npm ci の review-kit 取得より優先されて失敗させる
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: review-kit(private)を取得できるようにする
        env:
          TOKEN: ${{ secrets.REVIEW_KIT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/ytaka-fort57/review-kit".insteadOf "https://github.com/ytaka-fort57/review-kit"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/ytaka-fort57/review-kit".insteadOf "ssh://git@github.com/ytaka-fort57/review-kit"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/ytaka-fort57/review-kit".insteadOf "git@github.com:ytaka-fort57/review-kit"
      - name: Install Dependencies
        run: npm ci

      # Chromium は cache せず毎回取得する (docs/browser-e2e-test-design.md Phase 3)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Node Regression Tests
        run: node tests/run.mjs

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # upload-artifact v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
