name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '作成するタグ名 (例: v1.0.0)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
        with:
          fetch-depth: 0 # 一旦、履歴をすべて取得する
          # checkout が残す GITHUB_TOKEN の認証ヘッダーは、npm ci の review-kit 取得より優先されて失敗させる
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: review-kit(private)を取得できるようにする
        env:
          TOKEN: ${{ secrets.REVIEW_KIT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/ytaka-fort57/review-kit".insteadOf "https://github.com/ytaka-fort57/review-kit"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/ytaka-fort57/review-kit".insteadOf "ssh://git@github.com/ytaka-fort57/review-kit"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/ytaka-fort57/review-kit".insteadOf "git@github.com:ytaka-fort57/review-kit"

      - name: Install Dependencies
        run: npm ci

      - name: Run Required Verification
        run: |
          chmod +x ./package.sh ./verify.sh
          ./verify.sh

      - name: Fetch Latest Merged PR Infomation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 最新のマージ済みPRのタイトルと本文を取得して書き出す
          # 最新の1件を取得
          gh pr list --state merged --base Release --limit 1 --json title,body --template \
          '{{ range . }}# {{ .title }}{{ "\n\n" }}{{ .body }}{{ end }}' > release_notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            ./package/*.zip \
            --title "Release $TAG_NAME" \
            --notes-file release_notes.md \
            --draft
