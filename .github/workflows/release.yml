name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '作成するタグ名 (例: v1.0.0)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
        with:
          fetch-depth: 0 # 一旦、履歴をすべて取得する

      - name: Create ZIP File
        run: |
          # 念の為、実行権限を与えておく
          chmod +x ./package.sh
          ./package.sh

      - name: Verify ZIP Contents
        run: |
          for zip_file in ./package/*.zip; do
            entries="$(unzip -Z1 "$zip_file")"
            if grep -Eq '(^|/)(\.agents|\.claude|\.githooks|\.github|docs|package)(/|$)' <<< "$entries"; then
              echo "$zip_file に開発用ファイルが含まれています"
              exit 1
            fi
            test "$(grep -c '^manifest.json$' <<< "$entries")" -eq 1
            if grep -q '^manifest_firefox.json$' <<< "$entries"; then
              echo "$zip_file に置換前のFirefox manifestが残っています"
              exit 1
            fi
          done

      - name: Fetch Latest Merged PR Infomation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 最新のマージ済みPRのタイトルと本文を取得して書き出す
          # 最新の1件を取得
          gh pr list --state merged --base Release --limit 1 --json title,body --template \
          '{{ range . }}# {{ .title }}{{ "\n\n" }}{{ .body }}{{ end }}' > release_notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            ./package/*.zip \
            --title "Release $TAG_NAME" \
            --notes-file release_notes.md \
            --draft
