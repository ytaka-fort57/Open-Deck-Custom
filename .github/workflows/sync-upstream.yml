name: Review upstream

# 本家 Release をcustomへmergeせず、前回確認済みSHAとの差分をレビューIssueにまとめる。
# 採用する変更は現在のcustom構造へ意味単位で再実装し、確認済みSHAをPR内で更新する。

on:
  schedule:
    # 毎週月曜 03:20 JST (cron は UTC)
    - cron: "20 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: review-upstream
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom branch
        # 本家と同じく SHA で固定する (checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: custom
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/kawa-nobu/Open-Deck.git
          git fetch upstream Release

      - name: Prepare review report
        id: review
        shell: bash
        run: |
          set -euo pipefail

          base="$(tr -d '[:space:]' < .github/upstream-base)"
          latest="$(git rev-parse upstream/Release)"
          report="$RUNNER_TEMP/upstream-review.md"

          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo ".github/upstream-base must contain one full commit SHA" >&2
            exit 1
          fi
          git cat-file -e "$base^{commit}"

          if [ "$base" = "$latest" ]; then
            echo "本家の未確認更新はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$base" "$latest"; then
            echo "確認済みSHAが upstream/Release の祖先ではありません。履歴を手動確認してください。" >&2
            exit 1
          fi

          {
            echo "本家 \`kawa-nobu/Open-Deck:Release\` に未確認の更新があります。"
            echo
            echo "- 確認済み: \`$base\`"
            echo "- 最新: \`$latest\`"
            echo "- 比較: https://github.com/kawa-nobu/Open-Deck/compare/$base...$latest"
            echo
            echo "## コミット"
            git log --reverse --format='- `%h` %s (%cs)' "$base..$latest"
            echo
            echo "## 変更ファイル"
            echo '```text'
            git diff --name-status "$base..$latest"
            echo '```'
            echo
            echo "## 見積もり"
            echo '```text'
            git diff --stat "$base..$latest"
            echo '```'
            echo
            echo "## 対応"
            echo "- 各コミットを 採用 / 対応不要 / 既に独自実装済み に分類する"
            echo "- 採用分はmergeせず、customの現在構造へ意味単位で再実装する"
            echo "- \`./verify.sh\` と実ブラウザー確認を行う"
            echo "- PRで \`.github/upstream-base\` と \`docs/upstream-port-log.md\` を更新する"
          } > "$report"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Create or update review issue
        if: steps.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.review.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail

          # Issue の作成は GraphQL の createIssue を使わない。
          # この公開フォークではジョブに Issues: write があってもその mutation が拒否される。
          title="chore: upstream Release の変更をレビュー"
          query="repo:${GITHUB_REPOSITORY} is:issue is:open in:title ${title}"
          existing="$(gh api --method GET search/issues -f q="$query" \
            --jq '.items[] | [.number, .title] | @tsv' \
            | awk -F '\t' -v title="$title" '$2 == title { print $1; exit }')"

          payload="$RUNNER_TEMP/upstream-issue.json"
          jq -n --rawfile body "$REPORT_PATH" --arg title "$title" '{title:$title, body:$body}' > "$payload"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" --input "$payload" --jq .html_url
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${existing}" --input "$payload" --jq .html_url
            echo "既存のレビューIssue #$existing を更新しました"
          fi
